name: Build AppImage release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-venv curl desktop-file-utils libegl1 libgl1

      - name: Build AppImage
        run: ./packaging/appimage/build-appimage.sh

      - name: Verify package
        run: |
          desktop-file-validate packaging/appimage/emuluna.desktop
          QT_QPA_PLATFORM=offscreen timeout 15 ./dist/EmuLuna-*.AppImage --appimage-extract-and-run --data-dir "$RUNNER_TEMP/emuluna-smoke" --screenshot "$RUNNER_TEMP/emuluna.png"
          sha256sum dist/EmuLuna-*.AppImage > dist/SHA256SUMS

      - name: Keep manually built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmuLuna-AppImage
          path: |
            dist/EmuLuna-*.AppImage
            dist/SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/EmuLuna-*.AppImage dist/SHA256SUMS --generate-notes --verify-tag
