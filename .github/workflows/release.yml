name: Build AppImage release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Use the tested Python runtime
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3-venv curl desktop-file-utils libegl1 libgl1

      - name: Build AppImage
        run: |
          python --version
          PYTHON=python ./packaging/appimage/build-appimage.sh

      - name: Verify package
        run: |
          desktop-file-validate packaging/appimage/emuluna.desktop
          QT_QPA_PLATFORM=offscreen timeout 15 ./dist/EmuLuna-*.AppImage --appimage-extract-and-run --data-dir "$RUNNER_TEMP/emuluna-smoke" --screenshot "$RUNNER_TEMP/emuluna.png"
          ./dist/EmuLuna-*.AppImage --appimage-extract >/dev/null
          test ! -e squashfs-root/usr/bin/EmuLuna/_internal/libstdc++.so.6
          test ! -e squashfs-root/usr/bin/EmuLuna/_internal/libgcc_s.so.1
          (cd dist && sha256sum EmuLuna-*.AppImage > SHA256SUMS)

      - name: Keep manually built artifacts
        uses: actions/upload-artifact@v7
        with:
          name: EmuLuna-AppImage
          path: |
            dist/EmuLuna-*.AppImage
            dist/SHA256SUMS

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/EmuLuna-*.AppImage dist/SHA256SUMS --generate-notes --verify-tag
